<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推文记录</title>
<style>
:root{
  --bg:#0f1419; --card:#16202a; --card2:#1c2733; --border:#2f3e4e;
  --text:#e7e9ea; --sub:#8b98a5; --accent:#1d9bf0; --btn:#1d9bf0; --ok:#00ba7c; --warn:#ffd400;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:8px 0 4px}
.meta{color:var(--sub);font-size:13px;margin-bottom:16px}
.nav{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px;margin-bottom:14px}
.nav-tabs{display:flex;gap:8px;flex:3 1 380px;flex-wrap:wrap}
.nav-tabs button{flex:1 1 30%;min-width:104px;background:var(--card2);border:1px solid var(--border);color:var(--sub);padding:10px 12px;border-radius:12px;text-align:left;cursor:pointer;transition:.15s}
.nav-tabs button b{display:block;font-size:15px;color:var(--text);font-weight:600}
.nav-tabs button span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.nav-tabs button.on{border-color:var(--accent);background:rgba(29,155,240,.1)}
.nav-tabs button.on b{color:var(--accent)}
.nav-filters{display:flex;gap:8px;align-items:center;flex:1 1 220px;flex-wrap:wrap;padding-left:14px;border-left:1px solid var(--border)}
.nav-filters .nav-label{font-size:12px;color:var(--sub)}
.nav-filters button{background:transparent;border:1px solid var(--border);color:var(--sub);padding:6px 14px;font-size:13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.nav-filters button:hover{border-color:var(--sub)}
.nav-filters button.on{border-color:var(--accent);color:var(--accent);background:rgba(29,155,240,.1)}
.count{color:var(--sub);font-size:12px;margin-bottom:14px}
.audit-box{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--card2);font-size:13px;line-height:1.7}
.audit-box .ok{color:#2ea043;font-weight:600}
.audit-box .bad{color:#e5534b;font-weight:600}
.audit-box ul{margin:6px 0 0;padding-left:18px;color:var(--sub)}
.audit-box li b{color:var(--text);font-weight:500}
.post{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 14px 12px;margin-bottom:16px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.round{font-size:12px;color:var(--sub)}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:600}
.b-new{background:rgba(0,186,124,.15);color:var(--ok)}
.b-overlap{background:rgba(255,212,0,.15);color:var(--warn)}
.b-same{background:rgba(139,152,165,.2);color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-bottom:8px}
.copy{background:transparent;border:1px solid var(--btn);color:var(--btn);padding:5px 14px;font-size:13px;border-radius:999px;cursor:pointer}
.copy.done{border-color:var(--ok);color:var(--ok)}
textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;line-height:1.7;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.empty{color:var(--sub);font-size:14px;padding:28px 4px;text-align:center}

/* 讲解人：并入速览栏，作为同一条新闻的附属块 */
.explain{margin:12px 0 2px;padding:12px 0 2px 12px;border-left:2px solid rgba(29,155,240,.45)}
.explain .ex-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.explain .ex-tag{font-size:12px;color:var(--accent);letter-spacing:.5px}
.explain .ex-note{font-size:12px;color:var(--sub);margin-bottom:8px}
.explain textarea{background:rgba(29,155,240,.05);font-size:14.5px}
.explain .copy{font-size:12px;padding:4px 12px}
.ex-src{font-size:12px;color:var(--accent);margin:2px 0 8px;opacity:.85}
.orphan{margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>推文记录</h1>
  <div class="meta">三栏各自独立 · 讲解人在速览栏内随文展示 · 正文可直接复制 · 逐条标注 ✅ 全新 / ⚠️ 部分重叠 / ▫️ 与之前一模一样 · 不含来源</div>

  <div class="nav">
    <div class="nav-tabs">
      <button data-t="v1" class="on"><b>新闻速览</b><span>挖细节 · 80 到 900 字</span></button>
      <button data-t="v2"><b>热点解构</b><span>追当天 · 30 到 250 字</span></button>
      <button data-t="v3"><b>博眼球</b><span>话术结构 · 30 到 150 字</span></button>
    </div>
    <div class="nav-filters">
      <span class="nav-label">筛选</span>
      <button class="on" data-f="all">全部</button>
      <button data-f="new">只看全新</button>
      <button data-f="overlap">只看重叠</button>
      <button data-f="explain">只看讲解人</button>
      <button data-f="audit" id="btnAudit" title="扫描元话语、中英排版惯性、测试残留">体检</button>
    </div>
  </div>
  <div class="count" id="count"></div>
  <div id="auditBox" class="audit-box" hidden></div>
  <div id="list"></div>
</div>
<script>
const POSTS = [];
const BADGE = {new:['b-new','✅ 全新'],overlap:['b-overlap','⚠️ 部分重叠'],same:['b-same','▫️ 与之前一模一样']};
const list = document.getElementById('list');
const countEl = document.getElementById('count');
let curTab = 'v1', curStatus = 'all';

async function load(){
  try{
    const auth = window.location.search || '';
    const res = await fetch('posts.jsonl' + (auth ? auth + '&' : '?') + 'v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    POSTS.length = 0;
    txt.trim().split('\n').filter(Boolean).forEach(l => POSTS.push(JSON.parse(l)));
    updateTabCounts();
    render();
  }catch(e){
    list.innerHTML = '<div class="post"><div class="note">数据加载失败：' + e.message + '</div></div>';
  }
}

function srcOf(p){ return ['v1','v2','v3','v4'].indexOf(p.src) >= 0 ? p.src : 'v1'; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const TAB_NAME = {v1:'新闻速览', v2:'热点解构', v3:'博眼球'};
const LABEL = {v1:'挖细节', v2:'追当天', v3:'话术结构'};

function updateTabCounts(){
  ['v1','v2','v3'].forEach(t=>{
    const n = POSTS.filter(p => srcOf(p) === t).length;
    const el = document.querySelector('.nav-tabs button[data-t="' + t + '"] span');
    if(el) el.textContent = LABEL[t] + ' · 共 ' + n + ' 条';
  });
}

/* 归一化标题，用于 link 匹配 */
function normTitle(s){
  return String(s||'').replace(/[\s　，。、：；！？（）()\[\]【】“”‘’"'0-9a-zA-Z]/g,'');
}

/* 把讲解人（v4）挂到它所讲解的 v1 条目下 */
function normRound(s){ return String(s||'').replace(/场$/,'').trim(); }

function buildExplainMap(){
  const v1s = POSTS.filter(p => srcOf(p) === 'v1');
  const v4s = POSTS.filter(p => srcOf(p) === 'v4');
  const map = new Map();   // v1 post -> v4 讲解人
  const usedV1 = new Set();
  const usedV4 = new Set();

  // 1) 优先用 link 精确匹配标题
  v4s.forEach(e=>{
    const key = normTitle(e.link);
    if(!key) return;
    const hit = v1s.find(p=>!usedV1.has(p) && normTitle(p.title) === key);
    if(hit){ map.set(hit, e); usedV1.add(hit); usedV4.add(e); }
  });

  // 2) link 退化为前缀包含匹配
  v4s.forEach(e=>{
    if(usedV4.has(e)) return;
    const key = normTitle(e.link);
    if(!key) return;
    const hit = v1s.find(p=>!usedV1.has(p) && (normTitle(p.title).includes(key) || key.includes(normTitle(p.title))));
    if(hit){ map.set(hit, e); usedV1.add(hit); usedV4.add(e); }
  });

  // 3) 兜底：同场次唯一匹配
  const orphans = [];
  v4s.forEach(e=>{
    if(usedV4.has(e)) return;
    const cand = v1s.filter(p=>!usedV1.has(p) && normRound(p.round) === normRound(e.round));
    if(cand.length === 1){ map.set(cand[0], e); usedV1.add(cand[0]); usedV4.add(e); }
    else orphans.push(e);
  });
  return {map, orphans};
}

function makeCopyBtn(btn, ta){
  btn.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(ta.value); }catch(e){ ta.select(); document.execCommand('copy'); }
    const old = btn.textContent;
    btn.textContent = '已复制 ✓'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = old; btn.classList.remove('done'); }, 1600);
  };
}

function renderPost(p){
  const div = document.createElement('div');
  div.className = 'post';
  const [cls,label] = BADGE[p.st] || BADGE.same;
  div.innerHTML = '<div class="head"><div class="left"><span class="round"></span><span class="badge ' + cls + '">' + label + '</span></div><button class="copy">复制全文</button></div><div class="note"></div>';
  div.querySelector('.round').textContent = p.round + ' · ' + p.title;
  div.querySelector('.note').textContent = p.note || '';
  const ta = document.createElement('textarea');
  ta.value = p.text;
  ta.rows = Math.min(18, p.text.split('\n\n').length + 2);
  div.appendChild(ta);
  makeCopyBtn(div.querySelector('.copy'), ta);
  return div;
}

function renderExplain(p){
  const box = document.createElement('div');
  box.className = 'explain';
  box.innerHTML = '<div class="ex-head"><span class="ex-tag">讲解人</span><button class="copy">复制讲解</button></div><div class="ex-note"></div>';
  box.querySelector('.ex-note').textContent = p.note || '';
  const ta = document.createElement('textarea');
  ta.value = p.text;
  ta.rows = Math.min(18, p.text.split('\n\n').length + 2);
  box.appendChild(ta);
  makeCopyBtn(box.querySelector('.copy'), ta);
  return box;
}

function render(){
  list.innerHTML = '';

  if(curTab === 'v1'){
    const {map, orphans} = buildExplainMap();
    let arr = POSTS.filter(p => srcOf(p) === 'v1');
    if(curStatus === 'new') arr = arr.filter(p => p.st === 'new');
    if(curStatus === 'overlap') arr = arr.filter(p => p.st !== 'new');
    arr = arr.slice().reverse();

    const allV4 = POSTS.filter(p => srcOf(p) === 'v4');
    const nExp = allV4.length;

    // 只看讲解人：只列讲解人正文，附上它所讲解的速览标题
    if(curStatus === 'explain'){
      countEl.textContent = '新闻速览 · 讲解人 ' + nExp + ' 条';
      if(!nExp){
        list.innerHTML = '<div class="empty">还没有讲解人条目</div>';
        return;
      }
      const titleOf = new Map();
      map.forEach((e, v1post)=> titleOf.set(e, v1post.title));
      allV4.slice().reverse().forEach(e=>{
        const div = renderPost(e);
        div.querySelector('.badge').textContent = '讲解人';
        const src = titleOf.get(e);
        if(src){
          const tag = document.createElement('div');
          tag.className = 'ex-src';
          tag.textContent = '讲解的是：' + src;
          div.querySelector('.note').after(tag);
        } else {
          const tag = document.createElement('div');
          tag.className = 'ex-src';
          tag.textContent = '未匹配到速览条目';
          div.querySelector('.note').after(tag);
        }
        list.appendChild(div);
      });
      return;
    }

    countEl.textContent = '新闻速览 · ' + arr.length + ' 条速览 · ' + nExp + ' 条讲解人';

    if(!arr.length && !orphans.length){
      list.innerHTML = '<div class="empty">这一栏还没有内容</div>';
      return;
    }

    arr.forEach(p=>{
      const div = renderPost(p);
      const e = map.get(p);
      if(e) div.appendChild(renderExplain(e));
      list.appendChild(div);
    });

    orphans.forEach(e=>{
      const div = renderPost(e);
      div.classList.add('orphan');
      div.querySelector('.badge').textContent = '讲解人 · 未挂到速览条目';
      list.appendChild(div);
    });
    return;
  }

  let arr = POSTS.filter(p => srcOf(p) === curTab);
  if(curStatus === 'new') arr = arr.filter(p => p.st === 'new');
  if(curStatus === 'overlap') arr = arr.filter(p => p.st !== 'new');
  arr = arr.slice().reverse();

  countEl.textContent = (TAB_NAME[curTab] || '新闻速览') + ' · ' + arr.length + ' 条';

  if(!arr.length){
    list.innerHTML = '<div class="empty">这一栏还没有内容</div>';
    return;
  }
  arr.forEach(p=> list.appendChild(renderPost(p)));
}

document.querySelectorAll('.nav-tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.nav-tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    curTab = b.dataset.t;
    // 切栏时如果停在"只看讲解人"，回到全部，避免别的栏空白
    if(curTab !== 'v1' && curStatus === 'explain'){
      curStatus = 'all';
      document.querySelectorAll('.nav-filters button').forEach(x=>x.classList.remove('on'));
      document.querySelector('.nav-filters button[data-f="all"]').classList.add('on');
    }
    render();
  };
});
document.querySelectorAll('.nav-filters button').forEach(b=>{
  if(b.id === 'btnAudit') return;
  b.onclick = ()=>{
    document.querySelectorAll('.nav-filters button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    curStatus = b.dataset.f;
    // "只看讲解人"是速览栏专属，点它先切回速览
    if(curStatus === 'explain' && curTab !== 'v1'){
      curTab = 'v1';
      document.querySelectorAll('.nav-tabs button').forEach(x=>x.classList.remove('on'));
      document.querySelector('.nav-tabs button[data-t="v1"]').classList.add('on');
    }
    render();
  };
});

// 体检：调 /audit 拿全库扫描结果
const auditBox = document.getElementById('auditBox');
document.getElementById('btnAudit').onclick = async ()=>{
  const btn = document.getElementById('btnAudit');
  btn.textContent = '体检中…';
  try{
    const res = await fetch('/audit?t=' + Date.now(), {cache:'no-store'});
    const d = await res.json();
    if(!d.bad){
      auditBox.innerHTML = '<span class="ok">体检通过</span> · 全库 ' + d.total + ' 条（讲解人 ' + d.v4 + ' 条），无元话语、无中英排版惯性、无测试残留。';
    }else{
      auditBox.innerHTML = '<span class="bad">发现 ' + d.bad + ' 条待修</span> · 全库 ' + d.total + ' 条'
        + '<ul>' + d.items.map(it => '<li><b>' + (it.src||'v1') + '</b> ' + esc(it.title) + ' — ' + it.issues.join('、') + '</li>').join('') + '</ul>';
    }
    auditBox.hidden = false;
  }catch(e){
    auditBox.innerHTML = '<span class="bad">体检失败：</span>' + esc(String(e));
    auditBox.hidden = false;
  }
  btn.textContent = '体检';
};
load();
</script>
</body>
</html>
