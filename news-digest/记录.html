<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推文记录</title>
<style>
:root{
  --bg:#0f1419; --card:#16202a; --card2:#1c2733; --border:#2f3e4e;
  --text:#e7e9ea; --sub:#8b98a5; --accent:#1d9bf0; --btn:#1d9bf0; --ok:#00ba7c; --warn:#ffd400;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:8px 0 4px}
.meta{color:var(--sub);font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{flex:1 1 30%;min-width:104px;background:var(--card);border:1px solid var(--border);color:var(--sub);padding:10px 12px;border-radius:12px;text-align:left;cursor:pointer;transition:.15s}
.tabs button b{display:block;font-size:15px;color:var(--text);font-weight:600}
.tabs button span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.tabs button.on{border-color:var(--accent);background:rgba(29,155,240,.1)}
.tabs button.on b{color:var(--accent)}
.filters{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.filters button{background:transparent;border:1px solid var(--border);color:var(--sub);padding:5px 13px;font-size:12px;border-radius:999px;cursor:pointer}
.filters button.on{border-color:var(--accent);color:var(--accent)}
.count{color:var(--sub);font-size:12px;margin-bottom:14px}
.post{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 14px 12px;margin-bottom:16px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.round{font-size:12px;color:var(--sub)}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:600}
.b-new{background:rgba(0,186,124,.15);color:var(--ok)}
.b-overlap{background:rgba(255,212,0,.15);color:var(--warn)}
.b-same{background:rgba(139,152,165,.2);color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-bottom:8px}
.copy{background:transparent;border:1px solid var(--btn);color:var(--btn);padding:5px 14px;font-size:13px;border-radius:999px;cursor:pointer}
.copy.done{border-color:var(--ok);color:var(--ok)}
textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;line-height:1.7;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.empty{color:var(--sub);font-size:14px;padding:28px 4px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>推文记录</h1>
  <div class="meta">四个栏目各自独立 · 正文可直接复制 · 逐条标注 ✅ 全新 / ⚠️ 部分重叠 / ▫️ 与之前一模一样 · 不含来源</div>

  <div class="tabs">
    <button data-t="v1" class="on"><b>新闻速览</b><span>挖细节 · 80 到 350 字</span></button>
    <button data-t="v4"><b>讲解人</b><span>讲透逻辑 · 150 到 500 字</span></button>
    <button data-t="v2"><b>热点解构</b><span>追当天 · 30 到 250 字</span></button>
    <button data-t="v3"><b>博眼球</b><span>话术结构 · 30 到 150 字</span></button>
  </div>

  <div class="filters">
    <button class="on" data-f="all">全部</button>
    <button data-f="new">只看全新</button>
    <button data-f="overlap">只看重叠</button>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script>
const POSTS = [];
const BADGE = {new:['b-new','✅ 全新'],overlap:['b-overlap','⚠️ 部分重叠'],same:['b-same','▫️ 与之前一模一样']};
const list = document.getElementById('list');
const countEl = document.getElementById('count');
let curTab = 'v1', curStatus = 'all';

async function load(){
  try{
    const auth = window.location.search || '';
    const res = await fetch('posts.jsonl' + (auth ? auth + '&' : '?') + 'v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    POSTS.length = 0;
    txt.trim().split('\n').filter(Boolean).forEach(l => POSTS.push(JSON.parse(l)));
    updateTabCounts();
    render();
  }catch(e){
    list.innerHTML = '<div class="post"><div class="note">数据加载失败：' + e.message + '</div></div>';
  }
}

function srcOf(p){ return ['v1','v2','v3','v4'].indexOf(p.src) >= 0 ? p.src : 'v1'; }

const TAB_NAME = {v1:'新闻速览', v4:'讲解人', v2:'热点解构', v3:'博眼球'};

function updateTabCounts(){
  const LABEL = {v1:'挖细节', v4:'讲透逻辑', v2:'追当天', v3:'话术结构'};
  ['v1','v4','v2','v3'].forEach(t=>{
    const n = POSTS.filter(p => srcOf(p) === t).length;
    const el = document.querySelector('.tabs button[data-t="' + t + '"] span');
    if(el) el.textContent = LABEL[t] + ' · 共 ' + n + ' 条';
  });
}

function render(){
  list.innerHTML = '';
  let arr = POSTS.filter(p => srcOf(p) === curTab);
  if(curStatus === 'new') arr = arr.filter(p => p.st === 'new');
  if(curStatus === 'overlap') arr = arr.filter(p => p.st !== 'new');
  arr = arr.slice().reverse();

  countEl.textContent = (TAB_NAME[curTab] || '新闻速览') + ' · ' + arr.length + ' 条';

  if(!arr.length){
    list.innerHTML = '<div class="empty">这一栏还没有内容</div>';
    return;
  }

  arr.forEach((p)=>{
    const div = document.createElement('div');
    div.className = 'post';
    const [cls,label] = BADGE[p.st] || BADGE.same;
    div.innerHTML = '<div class="head"><div class="left"><span class="round"></span><span class="badge ' + cls + '">' + label + '</span></div><button class="copy">复制全文</button></div><div class="note"></div>';
    div.querySelector('.round').textContent = p.round + ' · ' + p.title;
    div.querySelector('.note').textContent = p.note || '';
    const ta = document.createElement('textarea');
    ta.value = p.text;
    ta.rows = Math.min(18, p.text.split('\n\n').length + 2);
    div.appendChild(ta);
    const btn = div.querySelector('.copy');
    btn.onclick = async ()=>{
      try{ await navigator.clipboard.writeText(p.text); }catch(e){ ta.select(); document.execCommand('copy'); }
      btn.textContent = '已复制 ✓'; btn.classList.add('done');
      setTimeout(()=>{ btn.textContent='复制全文'; btn.classList.remove('done'); }, 1600);
    };
    list.appendChild(div);
  });
}

document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    curTab = b.dataset.t;
    render();
  };
});
document.querySelectorAll('.filters button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    curStatus = b.dataset.f;
    render();
  };
});
load();
</script>
</body>
</html>
